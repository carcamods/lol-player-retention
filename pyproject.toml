[project]
name = "lolret"
version = "0.1.0"
description = "Predicts whether a ranked League of Legends player stops playing in the next 28 days, built point-in-time from the Riot API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matias Carcamo", email = "matiascrgv@gmail.com" }]
# 3.12 stays supported so the package installs on Google Colab (see docs/decisions/0004).
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.1",
    "typer>=0.27.3",
]

[project.scripts]
lolret = "lolret.cli:app"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "N",       # pep8-naming
    "S",       # bandit: security checks
    "PT",      # pytest style
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
