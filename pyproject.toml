[project]
name = "lolret"
version = "0.1.0"
description = "Predicts whether a ranked League of Legends player stops playing in the next 28 days, built point-in-time from the Riot API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matias Carcamo", email = "matiascrgv@gmail.com" }]
# 3.12 stays supported so the package installs on Google Colab (see docs/decisions/0004).
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "typer>=0.27.3",
]

[project.scripts]
lolret = "lolret.cli:app"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
notebooks = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pandas>=3.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "N",       # pep8-naming
    "S",       # bandit: security checks
    "PT",      # pytest style
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # assert is how pytest works; seeded test data needs no crypto PRNG

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true  # pyarrow and scikit-learn ship no type stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
